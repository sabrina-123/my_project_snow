<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panier · ShopNow</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/" data-testid="home-link">Shop<span>Now</span></a><div class="nav-links"><a href="/products.html" data-testid="products-link">Produits</a><a href="/cart.html" data-testid="cart-link">Panier (<span data-testid="cart-count">0</span>)</a></div><div class="nav-user" data-testid="auth-area"></div></div></nav><main><div class="container"><div class="section-head"><h1>Mon panier</h1><p class="muted">Vérifiez vos articles avant de commander.</p></div><div id="cart-root" data-testid="cart"></div></div></main><footer>ShopNow · Application pédagogique de stratégie de tests</footer><script src="/app.js"></script><script>function renderCart(){const root=document.getElementById('cart-root'),c=ShopNow.getCart();if(!c.length){root.innerHTML='<div class="empty" data-testid="empty-cart"><div style="font-size:60px">🛒</div><h2>Votre panier est vide</h2><a class="btn btn-primary" href="/products.html">Voir les produits</a></div>';return}const total=c.reduce((s,i)=>s+i.price*i.quantity,0);root.innerHTML=`<div class="cart-layout"><section>${c.map(i=>`<article class="cart-item" data-testid="cart-item-${i.id}"><div class="cart-icon">${i.emoji}</div><div class="cart-info"><h3>${i.name}</h3><span class="muted">${ShopNow.formatPrice(i.price)}</span></div><div class="qty"><button data-testid="decrease-${i.id}" onclick="ShopNow.updateQuantity(${i.id},-1)">−</button><strong data-testid="quantity-${i.id}">${i.quantity}</strong><button data-testid="increase-${i.id}" onclick="ShopNow.updateQuantity(${i.id},1)">+</button></div><strong>${ShopNow.formatPrice(i.price*i.quantity)}</strong><button class="btn btn-danger" data-testid="remove-item-${i.id}" onclick="ShopNow.removeFromCart(${i.id})">Supprimer</button></article>`).join('')}</section><aside class="summary"><h2>Résumé</h2><div class="summary-row"><span>Sous-total</span><strong>${ShopNow.formatPrice(total)}</strong></div><div class="summary-row"><span>Livraison</span><strong>Gratuite</strong></div><div class="summary-row summary-total"><span>Total</span><strong data-testid="cart-total">${ShopNow.formatPrice(total)}</strong></div><button class="btn btn-primary" style="width:100%" data-testid="checkout-button" onclick="alert('Commande simulée pour le TP')">Passer la commande</button></aside></div>`}window.renderCart=renderCart;document.addEventListener('DOMContentLoaded',()=>{if(ShopNow.requireAuth())renderCart()});</script></body></html>
