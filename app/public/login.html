<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · ShopNow</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/" data-testid="home-link">Shop<span>Now</span></a><div class="nav-links"><a href="/products.html" data-testid="products-link">Produits</a><a href="/cart.html" data-testid="cart-link">Panier (<span data-testid="cart-count">0</span>)</a></div><div class="nav-user" data-testid="auth-area"></div></div></nav><main><div class="form-page"><div class="form-card"><span class="category">Bienvenue</span><h1>Connexion</h1><p class="muted">Connectez-vous pour pouvoir acheter.</p><form id="login-form" data-testid="login-form"><div class="field"><label>Email</label><input id="email" data-testid="login-email" type="email" required value="student@shopnow.test"></div><div class="field"><label>Mot de passe</label><input id="password" data-testid="login-password" type="password" required value="Password123!"></div><button class="btn btn-primary" data-testid="login-submit">Se connecter</button><div id="message" class="message" data-testid="login-message"></div></form><p class="muted">Pas encore de compte ? <a href="/register.html" data-testid="register-link" style="color:#4338ca;font-weight:700">Créer un compte</a></p></div></div></main><footer>ShopNow · Application pédagogique de stratégie de tests</footer><script src="/app.js"></script><script>document.getElementById('login-form').onsubmit=async e=>{e.preventDefault();try{const d=await ShopNow.api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});ShopNow.setUser(d.user);message.textContent='Connexion réussie';message.className='message success';setTimeout(()=>location.href=new URLSearchParams(location.search).get('redirect')||'/products.html',300)}catch(x){message.textContent=x.message;message.className='message error'}}</script></body></html>
