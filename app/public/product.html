<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produit · ShopNow</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/" data-testid="home-link">Shop<span>Now</span></a><div class="nav-links"><a href="/products.html" data-testid="products-link">Produits</a><a href="/cart.html" data-testid="cart-link">Panier (<span data-testid="cart-count">0</span>)</a></div><div class="nav-user" data-testid="auth-area"></div></div></nav><main><div class="container"><div id="detail" data-testid="product-page"></div></div></main><footer>ShopNow · Application pédagogique de stratégie de tests</footer><script src="/app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id'),p=await ShopNow.api('/api/products/'+id);detail.innerHTML=`<section class="detail"><div class="detail-visual">${p.emoji}</div><div><span class="category">${p.category}</span><h1 data-testid="product-name">${p.name}</h1><p class="muted">${p.description}</p><div class="detail-price" data-testid="product-price">${ShopNow.formatPrice(p.price)}</div><button class="btn btn-primary" data-testid="add-to-cart-${p.id}" onclick='ShopNow.addToCart(${JSON.stringify(p)})'>Ajouter au panier</button> <a class="btn btn-outline" href="/products.html">Continuer mes achats</a></div></section>`});</script></body></html>
