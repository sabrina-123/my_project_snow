<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produits · ShopNow</title><link rel="stylesheet" href="/style.css"></head><body><nav class="navbar"><div class="container nav-inner"><a class="brand" href="/" data-testid="home-link">Shop<span>Now</span></a><div class="nav-links"><a href="/products.html" data-testid="products-link">Produits</a><a href="/cart.html" data-testid="cart-link">Panier (<span data-testid="cart-count">0</span>)</a></div><div class="nav-user" data-testid="auth-area"></div></div></nav><main><div class="container"><div class="section-head"><h1>Nos produits</h1><p class="muted">Connectez-vous pour ajouter un produit au panier.</p></div><div class="toolbar"><input id="search" data-testid="product-search" placeholder="Rechercher..."><select id="category" data-testid="category-filter"><option value="">Toutes les catégories</option><option>Informatique</option><option>Audio</option><option>Lifestyle</option></select></div><div id="products" class="grid" data-testid="products-page"></div></div></main><footer>ShopNow · Application pédagogique de stratégie de tests</footer><script src="/app.js"></script><script>let all=[];function render(){const q=search.value.toLowerCase(),c=category.value;products.innerHTML=all.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!c||p.category===c)).map(p=>`<article class="card" data-testid="product-card-${p.id}"><div class="product-visual">${p.emoji}</div><div class="product-body"><span class="category">${p.category}</span><h3>${p.name}</h3><p class="muted">${p.description}</p><div class="price">${ShopNow.formatPrice(p.price)}</div><div class="product-actions"><a class="btn btn-outline" href="/product.html?id=${p.id}" data-testid="view-product-${p.id}">Voir</a><button class="btn btn-primary" data-testid="add-to-cart-${p.id}" onclick='ShopNow.addToCart(${JSON.stringify(p)})'>Ajouter</button></div></div></article>`).join('')||'<div class="empty">Aucun produit trouvé.</div>'}document.addEventListener('DOMContentLoaded',async()=>{all=await ShopNow.api('/api/products');render();search.oninput=render;category.onchange=render});</script></body></html>
