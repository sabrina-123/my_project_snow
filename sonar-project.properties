# ============================================================
# SonarQube - ShopNow Test Platform
# ============================================================
# NOTE : le runtime Node utilisé par l'analyseur JavaScript est
# fixé dans le Jenkinsfile (-Dsonar.nodejs.executable=/opt/node18/bin/node).
# SonarQube 9.9 recommande Node 18 : avec Node 22 l'analyse passe de
# quelques secondes à plusieurs minutes et fait expirer le timeout Jenkins.
# ============================================================

# Identification du projet
sonar.projectKey=shopnow
sonar.projectName=ShopNow Test Platform
sonar.projectVersion=1.0

# ============================================================
# Code source analysé (application uniquement)
# ============================================================
sonar.sources=app/src

# ============================================================
# Tests
# ============================================================
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# ============================================================
# Exclusions
# ============================================================
sonar.exclusions=**/node_modules/**,**/coverage/**

# ============================================================
# Couverture de code - NYC / LCOV
# (généré par : npm run test:coverage)
# ============================================================
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ============================================================
# Encodage
# ============================================================
sonar.sourceEncoding=UTF-8
